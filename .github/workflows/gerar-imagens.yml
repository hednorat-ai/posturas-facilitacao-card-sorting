name: Gerar imagens das posturas 11 a 20
on:
  push:
    paths:
      - ".github/workflows/gerar-imagens.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair-imagens:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar biblioteca de leitura do PDF
        run: python -m pip install "pymupdf>=1.24,<2" Pillow
      - name: Extrair as dez posturas como PNG
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          pdf = Path("Posturas_Facilitacao_11_a_20.pdf")
          if not pdf.exists():
              raise SystemExit("Arquivo PDF não encontrado.")
          doc = fitz.open(pdf)
          if len(doc) != 10:
              raise SystemExit(f"Esperadas 10 páginas; encontradas {len(doc)}.")
          folder = Path("images")
          folder.mkdir(exist_ok=True)
          for index, page in enumerate(doc):
              images = page.get_images(full=True)
              if not images:
                  raise SystemExit(f"Página {index+1} sem imagem")
              # Extrair a fotografia original, e não a página com legenda
              xref = max(images, key=lambda a: len(doc.extract_image(a[0])["image"]))[0]
              im = Image.open(BytesIO(doc.extract_image(xref)["image"])).convert("RGB")
              path = folder / f"postura-{index + 11:02d}.png"
              im.save(path, optimize=True)
              print("Imagem original recuperada:", path, im.size)
          PY
      - name: Publicar imagens no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/postura-{11..20}.png
          if git diff --cached --quiet; then
            echo "Imagens já atualizadas."
          else
            git commit -m "Gerar imagens PNG individuais das posturas 11 a 20"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
